name: RSpec

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rspec:
    name: RSpec (Redis ${{ matrix.redis }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        redis: ["6.2", "7"]

    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rspec --format documentation
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
